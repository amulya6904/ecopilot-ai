[pytest]
# The repository cache can remain locked after an interrupted Windows process.
# Cache-backed selection is not used by this suite, so keep normal runs stateless.
addopts = -p no:cacheprovider -m "not energyplus and not energyplus_runtime and not energyplus_safety and not ollama_safety"
markers =
    energyplus: optional real EnergyPlus installation and simulation test
    energyplus_runtime: real EnergyPlus Python Runtime API control test
    energyplus_safety: real EnergyPlus Python Runtime API Phase 9 safety test
    ollama: optional live local Ollama and MCP advisory-agent test
    ollama_safety: optional live Ollama proposal through Phase 9 safety
