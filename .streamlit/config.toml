[theme]
base = "light"
font = "sans-serif"
codeFont = "monospace"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["48px", "34px", "25px", "20px", "17px", "15px"]
headingFontWeights = [450, 500, 550, 600, 600, 600]
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = true
chartCategoricalColors = [
  "#2A2925",
  "#718777",
  "#A69C8C",
  "#2F654D",
  "#A77821",
  "#8D3C35",
]

[theme.light]
primaryColor = "#11110F"
backgroundColor = "#F5F2EB"
secondaryBackgroundColor = "#FAF8F3"
textColor = "#171714"
linkColor = "#171714"
codeBackgroundColor = "#EEEAE1"
codeTextColor = "#171714"
borderColor = "#DDD8CE"
blueColor = "#506574"
greenColor = "#2F654D"
orangeColor = "#8A641D"
redColor = "#8D3C35"
grayColor = "#86827A"
dataframeBorderColor = "#DDD8CE"
dataframeHeaderBackgroundColor = "#EEEAE1"

[theme.dark]
primaryColor = "#F5F2EB"
backgroundColor = "#171714"
secondaryBackgroundColor = "#22221F"
textColor = "#F5F2EB"
linkColor = "#F5F2EB"
codeBackgroundColor = "#2A2925"
codeTextColor = "#F5F2EB"
borderColor = "#55534D"
blueColor = "#A7B6C0"
greenColor = "#8DB49B"
orangeColor = "#D2AD66"
redColor = "#CE8E88"
grayColor = "#BBB5AA"
dataframeBorderColor = "#55534D"
dataframeHeaderBackgroundColor = "#2A2925"

[theme.light.sidebar]
backgroundColor = "#FAF8F3"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#171714"
borderColor = "#DDD8CE"
primaryColor = "#11110F"

[theme.dark.sidebar]
backgroundColor = "#11110F"
secondaryBackgroundColor = "#22221F"
textColor = "#F5F2EB"
borderColor = "#55534D"
primaryColor = "#F5F2EB"
