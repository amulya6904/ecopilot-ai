[theme]
font = "sans-serif"
codeFont = "monospace"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["34px", "27px", "22px", "18px", "16px", "14px"]
headingFontWeights = [650, 625, 600, 600, 600, 600]
baseRadius = "6px"
buttonRadius = "6px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = true
chartCategoricalColors = [
  "#1565C0",
  "#2E7D32",
  "#ED6C02",
  "#6A1B9A",
  "#C62828",
  "#546E7A",
]

[theme.light]
primaryColor = "#075E91"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6F8"
textColor = "#17212B"
linkColor = "#075E91"
codeBackgroundColor = "#EEF2F5"
codeTextColor = "#17212B"
borderColor = "#CBD5DE"
blueColor = "#075E91"
greenColor = "#1E6B3A"
orangeColor = "#A45100"
redColor = "#B42318"
grayColor = "#52606D"
dataframeBorderColor = "#CBD5DE"
dataframeHeaderBackgroundColor = "#E8EEF2"

[theme.dark]
primaryColor = "#59B5E8"
backgroundColor = "#111820"
secondaryBackgroundColor = "#1A242E"
textColor = "#E8EEF2"
linkColor = "#78C7F0"
codeBackgroundColor = "#202C37"
codeTextColor = "#E8EEF2"
borderColor = "#40505E"
blueColor = "#59B5E8"
greenColor = "#6FCF97"
orangeColor = "#F2B45E"
redColor = "#FF8A80"
grayColor = "#A7B4BE"
dataframeBorderColor = "#40505E"
dataframeHeaderBackgroundColor = "#263542"

[theme.light.sidebar]
backgroundColor = "#F3F6F8"
secondaryBackgroundColor = "#E8EEF2"
textColor = "#17212B"
borderColor = "#CBD5DE"
primaryColor = "#075E91"

[theme.dark.sidebar]
backgroundColor = "#0C131A"
secondaryBackgroundColor = "#1A242E"
textColor = "#E8EEF2"
borderColor = "#40505E"
primaryColor = "#59B5E8"
