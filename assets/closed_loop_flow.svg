<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Eight-step EcoPilot closed loop</title>
  <desc id="desc">Eight numbered stages from EnergyPlus physics through quantitative evidence.</desc>
  <rect width="1200" height="230" fill="#F5F2EB"/>
  <path d="M60 80H1140" stroke="#BBB5AA" stroke-width="1"/>
  <g font-family="Helvetica Neue, Segoe UI, Arial, sans-serif" fill="#171714">
    <g transform="translate(45 55)"><circle cx="15" cy="25" r="15" fill="#171714"/><text x="8" y="29" fill="#FFF" font-size="11">01</text><text x="0" y="72" font-size="12">EnergyPlus</text><text x="0" y="89" font-size="12">digital twin</text></g>
    <g transform="translate(190 55)"><circle cx="15" cy="25" r="15" fill="#171714"/><text x="8" y="29" fill="#FFF" font-size="11">02</text><text x="0" y="72" font-size="12">Runtime</text><text x="0" y="89" font-size="12">telemetry</text></g>
    <g transform="translate(335 55)"><circle cx="15" cy="25" r="15" fill="#171714"/><text x="8" y="29" fill="#FFF" font-size="11">03</text><text x="0" y="72" font-size="12">MCP tool</text><text x="0" y="89" font-size="12">layer</text></g>
    <g transform="translate(480 55)"><circle cx="15" cy="25" r="15" fill="#171714"/><text x="8" y="29" fill="#FFF" font-size="11">04</text><text x="0" y="72" font-size="12">Local LLM</text><text x="0" y="89" font-size="12">advisory</text></g>
    <g transform="translate(625 55)"><circle cx="15" cy="25" r="15" fill="#2F654D"/><text x="8" y="29" fill="#FFF" font-size="11">05</text><text x="0" y="72" font-size="12">Safety</text><text x="0" y="89" font-size="12">supervisor</text></g>
    <g transform="translate(770 55)"><circle cx="15" cy="25" r="15" fill="#171714"/><text x="8" y="29" fill="#FFF" font-size="11">06</text><text x="0" y="72" font-size="12">Actuator</text><text x="0" y="89" font-size="12">injection</text></g>
    <g transform="translate(915 55)"><circle cx="15" cy="25" r="15" fill="#171714"/><text x="8" y="29" fill="#FFF" font-size="11">07</text><text x="0" y="72" font-size="12">Verification</text><text x="0" y="89" font-size="12">+ fallback</text></g>
    <g transform="translate(1060 55)"><circle cx="15" cy="25" r="15" fill="#171714"/><text x="8" y="29" fill="#FFF" font-size="11">08</text><text x="0" y="72" font-size="12">Quantitative</text><text x="0" y="89" font-size="12">evidence</text></g>
  </g>
</svg>
