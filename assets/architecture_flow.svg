    <g transform="translate(659 70)"><rect width="184" height="124" fill="#E8F0EA" stroke="#2F654D"/><text x="18" y="42" fill="#2F654D" font-size="11" letter-spacing="1.4">FINAL AUTHORITY</text><text x="18" y="72" font-size="18">Safety supervisor</text><text x="18" y="96" font-size="12">Validate · clamp · reject</text></g>
    <g transform="translate(900 82)"><rect width="170" height="100" fill="#FFFFFF" stroke="#DDD8CE"/><text x="18" y="41" font-size="11" letter-spacing="1.4">CONTROL</text><text x="18" y="67" font-size="18">Actuator injection</text></g>
    <text x="500" y="243" font-size="12" fill="#55534D">Post-action observation · verified reset · fallback / rollback</text>
