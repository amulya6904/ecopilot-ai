<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">EcoPilot verified result summary</title>
  <desc id="desc">A restrained summary of energy, comfort, peak demand, and safety outcomes.</desc>
  <rect width="1200" height="360" fill="#171714"/>
  <g fill="#F5F2EB" font-family="Helvetica Neue, Segoe UI, Arial, sans-serif">
    <text x="70" y="70" font-size="12" letter-spacing="2.4">VERIFIED ENERGYPLUS RESULT</text>
    <text x="70" y="168" font-family="Georgia, Times New Roman, serif" font-size="88">5.626 kWh</text>
    <text x="70" y="205" font-size="17" fill="#D5D0C7">annual facility-electricity reduction</text>
    <text x="70" y="302" font-size="12" fill="#AFA99F">CONSERVATIVE SINGLE-ZONE · SAFETY-FIRST PROOF OF CONCEPT</text>
  </g>
  <g transform="translate(690 70)" font-family="Helvetica Neue, Segoe UI, Arial, sans-serif">
    <path d="M0 0H440M0 90H440M0 180H440M0 270H440" stroke="#55534D"/>
    <text x="0" y="35" fill="#AFA99F" font-size="11" letter-spacing="1.4">ANNUAL REDUCTION</text><text x="315" y="38" fill="#F5F2EB" font-size="25">0.0096%</text>
    <text x="0" y="125" fill="#AFA99F" font-size="11" letter-spacing="1.4">COMFORT PROXY</text><text x="315" y="128" fill="#F5F2EB" font-size="25">+0.167 pp</text>
    <text x="0" y="215" fill="#AFA99F" font-size="11" letter-spacing="1.4">PEAK DEMAND</text><text x="315" y="218" fill="#F5F2EB" font-size="19">Unchanged</text>
    <text x="0" y="305" fill="#AFA99F" font-size="11" letter-spacing="1.4">SEVERE / FATAL</text><text x="378" y="308" fill="#F5F2EB" font-size="25">0 / 0</text>
  </g>
</svg>
